name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon check --deny-warn
      - run: moon test --deny-warn
      - run: moon check --target js --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon build --target js
      - run: python -m pip install eccodes==2.50.1
      - run: python examples/verify_eccodes.py
      - run: python examples/verify_encoded.py
